on:
  workflow_dispatch:
      inputs:
        network:
            description: 'Network'
            required: true
            default: 'hardhat'
            type: choice
            options:
            - hardhat
            - bellecour

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
        contents: write # required by git-auto-commit-action
    environment: ${{ inputs.network }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - run: |
        echo "Network: $NETWORK"
        echo "IS_LOCAL_FORK: $IS_LOCAL_FORK"
        npm run upgrade -- --network $NETWORK
        echo "Test" > test.txt
      env:
        NETWORK: ${{ inputs.network }}
        IS_LOCAL_FORK: ${{ inputs.network == 'hardhat'}}
        PROD_PRIVATE_KEY: ${{ inputs.network == 'bellecour' && secrets.PROD_PRIVATE_KEY || '' }}
    - uses: stefanzweifel/git-auto-commit-action@v5
